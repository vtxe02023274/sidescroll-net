# Wire format of sidescroll-net, same as src/shared/protocol.ts.
# docs/protocol.md is generated from this file with pktspec: https://github.com/vtxe02023274/pktspec
name: sidescroll-net
version: 1
endian: little
opcode: u8
doc: Clients send buttons, the server answers with snapshots of every player in view.

structs:
  Entity:
    doc: One player as of the snapshot tick.
    fields:
      - name: id
        type: u16
      - name: x
        type: f32
      - name: y
        type: f32
        doc: Feet position, y grows downward.
      - name: vx
        type: f32
      - name: vy
        type: f32
      - name: foothold
        type: u16
        doc: Foothold the player stands on, 0 when airborne.
      - name: flags
        type: u8
        doc: Bit 0 facing left, bit 1 jump held.
      - name: drop_foothold
        type: u16
        doc: Foothold being dropped through.
      - name: drop_ticks
        type: u8
        doc: Ticks left before the dropped foothold can be landed on again.
      - name: attack_ticks
        type: u8
        doc: Ticks left in the current swing.
      - name: hurt_ticks
        type: u8
        doc: Ticks left of knockback.
      - name: rope
        type: u16
        doc: Rope the player is climbing, 0 when not on a rope.
      - name: rope_cooldown
        type: u8
        doc: Ticks before a rope can be grabbed again.

packets:
  - name: Input
    opcode: 0x01
    direction: c2s
    doc: Buttons for one client tick. Every input moves the player exactly one step.
    fields:
      - name: seq
        type: u32
      - name: buttons
        type: u8
        doc: Bit 0 left, bit 1 right, bit 2 jump, bit 3 down, bit 4 attack, bit 5 up.
      - name: view_tick
        type: u32
        doc: Server tick the client was showing other players at. Used to rewind hit checks.

  - name: Welcome
    opcode: 0x02
    direction: s2c
    doc: First message after connecting.
    fields:
      - name: player_id
        type: u16
      - name: tick_rate
        type: u8

  - name: Snapshot
    opcode: 0x03
    direction: s2c
    doc: Sent every other tick.
    fields:
      - name: tick
        type: u32
      - name: ack_seq
        type: u32
        doc: Last input sequence the server applied for this client.
      - name: entities
        type: Entity[]
        length: u16

  - name: SnapshotDelta
    opcode: 0x04
    direction: s2c
    doc: >-
      Snapshot sent as the changes from an earlier one, usually the previous one sent on the
      connection. Followed by `count` entities, each a u16 id, a u16 mask and then only the
      Entity fields after the id whose mask bit is set, bit 0 for x up to bit 11 for
      rope_cooldown, in Entity order. Every entity of the snapshot is listed, an entity that
      was not in the base has every bit set. The entity list is left out here because its
      fields depend on the mask.
    fields:
      - name: tick
        type: u32
      - name: ack_seq
        type: u32
        doc: Last input sequence the server applied for this client.
      - name: base_tick
        type: u32
        doc: Tick of the snapshot the changes are from.
      - name: count
        type: u16
